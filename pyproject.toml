[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "uqcalibrate"
dynamic = ["version"]                       # written once, in src/uqcalibrate/__init__.py (TECH-STACK section 8)
description = "Check whether a regression model's uncertainty is honest, and fix it when it is not."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]              # the only runtime dependency (MISSION API-5)
# authors: pending Carol's answer on the name to print and whether to list an email (PyPI shows it).
keywords = ["uncertainty", "calibration", "regression", "coverage", "prediction-interval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/cgudumotu/uq"
Errata = "https://github.com/cgudumotu/uq/blob/main/ERRATA.md"

# The `torch` extra (uqcalibrate.models) is added in M2 (TECH-STACK section 4).

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
# reproduce = [...]  is added on 2026-10-03 with the DONN port (TECH-STACK section 4, ADR-0001).

[tool.hatch.version]
path = "src/uqcalibrate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/uqcalibrate"]

[tool.hatch.build.targets.sdist]
include = ["src/uqcalibrate", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]              # src: the docstring examples run as tests
addopts = "-m 'not repro' --strict-markers --doctest-modules"
markers = [
  "rule(id): the MISSION.md rule this test verifies (TECH-STACK section 5)",
  "repro: golden reproduction tests; slow; run with `uv run pytest -m repro`",
]
filterwarnings = ["error"]                  # a warning is a failure (SYSTEM-DESIGN section 3.7)

[tool.coverage.run]
source = ["uqcalibrate"]

[tool.ruff]
include = ["*.py", "*.pyi", "**/pyproject.toml"]   # never Markdown: ERRATA.md quotes notebook code verbatim
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PT"]
